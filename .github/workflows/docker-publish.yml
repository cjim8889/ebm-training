name: Publish Docker image

on:
  push:
    branches: [ main, jax-corrected ]
    # Optionally trigger on tag pushes as well
    # tags: [ 'v*.*.*' ]

jobs:
  push_to_registry:
    name: Build and push Docker image to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # Use the GitHub actor (username) and the automatically generated token
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          # The image name confirmed earlier
          images: ghcr.io/cjim8889/ebm-training
          # Generate tags:
          # - Git SHA (short) for every push
          # - The Git tag if a tag is pushed (e.g., v1.0.0)
          # - 'latest' tag for pushes to the main branch
          tags: |
            type=sha,prefix=
            type=ref,event=tag
            type=ref,event=branch,enable=true,pattern=main

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          # Build context is the root of the repository
          context: .
          # Push the image after building
          push: true
          # Use the tags generated by the metadata step
          tags: ${{ steps.meta.outputs.tags }}
          # Use the labels generated by the metadata step
          labels: ${{ steps.meta.outputs.labels }}